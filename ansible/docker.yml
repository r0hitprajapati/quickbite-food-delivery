---
- name: Configure Application Server
  hosts: application
  become: true

  tasks:
    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Verify Docker
      command: docker --version
      register: docker_version

    - name: Display Docker version
      debug:
        var: docker_version.stdout
